name: Lint Code (Golint)

on: pull_request

permissions:
  contents: read

defaults:
  run:
    working-directory: ./

env:
  GONOSUMDB: github.com/mridang/dprint-go/*

jobs:
  code-linting:
    runs-on: ubuntu-latest

    steps:
      - name: Runner Common Setup
        uses: mridang/action-runner-common@v1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ github.workflow }}-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ github.workflow }}-${{ runner.os }}-

      - name: Lint
        run: make lint
